<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Before & After</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
}

body {
  display: flex;
  justify-content: center;
}


/* MAIN COMPARISON */

.comparison {
  position: relative;
  width: 100%;
  max-width: 1200px;
  aspect-ratio: 3 / 4;
  overflow: hidden;

  user-select: none;
  -webkit-user-select: none;

  touch-action: pan-y;
  cursor: ew-resize;
}


/* IMAGES */

.after-image,
.before-image {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  pointer-events: none;
}


/* BEFORE CLIPPING AREA */

.before-container {
  position: absolute;
  inset: 0;

  width: 50%;
  overflow: hidden;

  z-index: 2;
}


/*
Keeps the before image full-size while
the container reveals/hides it.
*/

.before-image {
  width: 100vw;
  max-width: 1200px;
}


/* DIVIDER */

.divider {
  position: absolute;

  top: 0;
  bottom: 0;
  left: 50%;

  width: 2px;

  background: white;

  transform: translateX(-50%);

  z-index: 5;

  pointer-events: none;

  box-shadow:
    0 0 4px rgba(0, 0, 0, 0.25);
}


/* HANDLE */

.handle {
  position: absolute;

  top: 50%;
  left: 50%;

  width: 48px;
  height: 48px;

  transform: translate(-50%, -50%);

  border: 2px solid white;
  border-radius: 50%;

  background:
    rgba(25, 25, 25, 0.55);

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  font-family:
    Arial, sans-serif;

  font-size: 25px;
  line-height: 1;

  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}


/* LABELS */

.label {
  position: absolute;

  z-index: 4;

  padding: 8px 12px;

  background:
    rgba(20, 20, 20, 0.58);

  color: white;

  font-family:
    Arial, sans-serif;

  font-size: 11px;
  font-weight: 500;

  letter-spacing: 0.13em;

  border-radius: 2px;

  pointer-events: none;

  transition:
    opacity 0.15s ease;

  white-space: nowrap;
}


/* BEFORE LABEL */

.before-label {
  top: 20px;
  left: 20px;
}


/* CONCEPTUAL LABEL */

.after-label {
  right: 20px;
  bottom: 20px;
}


/* HIDDEN LABEL STATE */

.label-hidden {
  opacity: 0;
}


/* MOBILE */

@media (max-width: 600px) {

  .handle {
    width: 44px;
    height: 44px;

    font-size: 22px;
  }

  .label {
    padding: 7px 9px;

    font-size: 9px;

    letter-spacing: 0.1em;
  }

  .before-label {
    top: 14px;
    left: 14px;
  }

  .after-label {
    right: 14px;
    bottom: 14px;
  }

}

</style>
</head>


<body>


<div
  class="comparison"
  id="comparison"
>


  <!-- AFTER IMAGE -->

  <img
    class="after-image"
    src="https://images.squarespace-cdn.com/content/v1/69d6b04da92f0f032bfc10cf/1ed0bb99-4c3f-4d73-b525-21c6a62fd29e/Foyer.png?format=1500w"
    alt="Conceptual rendering of remodeled foyer"
  >


  <!-- BEFORE IMAGE -->

  <div
    class="before-container"
    id="beforeContainer"
  >

    <img
      class="before-image"
      src="https://images.squarespace-cdn.com/content/v1/69d6b04da92f0f032bfc10cf/392fcd4f-91f6-4305-b76d-0a359081a4e7/BAAFoyer.png?format=1500w"
      alt="Original foyer"
    >

  </div>


  <!-- BEFORE LABEL -->

  <div
    class="label before-label"
    id="beforeLabel"
  >
    BEFORE
  </div>


  <!-- AFTER LABEL -->

  <div
    class="label after-label"
    id="afterLabel"
  >
    CONCEPTUAL RENDERING
  </div>


  <!-- SLIDER -->

  <div
    class="divider"
    id="divider"
  >

    <div class="handle">

      <span>‹</span>

      <span>›</span>

    </div>

  </div>


</div>


<script>

const comparison =
  document.getElementById("comparison");

const beforeContainer =
  document.getElementById("beforeContainer");

const divider =
  document.getElementById("divider");

const beforeLabel =
  document.getElementById("beforeLabel");

const afterLabel =
  document.getElementById("afterLabel");


let dragging = false;


/* UPDATE LABEL VISIBILITY */

function updateLabels(percentage) {

  /*
  Hide BEFORE once the slider gets
  close to the left-side label.
  */

  if (percentage < 22) {

    beforeLabel.classList.add(
      "label-hidden"
    );

  } else {

    beforeLabel.classList.remove(
      "label-hidden"
    );

  }


  /*
  Hide CONCEPTUAL RENDERING once
  there isn't enough after-image
  remaining on the right.
  */

  if (percentage > 72) {

    afterLabel.classList.add(
      "label-hidden"
    );

  } else {

    afterLabel.classList.remove(
      "label-hidden"
    );

  }

}


/* MOVE SLIDER */

function setPosition(clientX) {

  const rect =
    comparison.getBoundingClientRect();


  let position =
    clientX - rect.left;


  position =
    Math.max(
      0,
      Math.min(
        position,
        rect.width
      )
    );


  const percentage =
    (position / rect.width) * 100;


  beforeContainer.style.width =
    percentage + "%";


  divider.style.left =
    percentage + "%";


  updateLabels(
    percentage
  );

}


/* POINTER / TOUCH EVENTS */

comparison.addEventListener(
  "pointerdown",
  function(event) {

    dragging = true;


    comparison.setPointerCapture(
      event.pointerId
    );


    setPosition(
      event.clientX
    );

  }
);


comparison.addEventListener(
  "pointermove",
  function(event) {

    if (!dragging) return;


    setPosition(
      event.clientX
    );

  }
);


comparison.addEventListener(
  "pointerup",
  function() {

    dragging = false;

  }
);


comparison.addEventListener(
  "pointercancel",
  function() {

    dragging = false;

  }
);


/* INITIAL STATE */

updateLabels(50);

</script>


</body>
</html>
